<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3: API Integration & Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="carousel-container">
        <h2>Featured Interface Components</h2>
        <div class="carousel">
            <div class="carousel-slide active"><h3>Slide Focus Item 1</h3></div>
            <div class="carousel-slide"><h3>Slide Focus Item 2</h3></div>
            <div class="carousel-slide"><h3>Slide Focus Item 3</h3></div>
            <button id="prevBtn" class="control-btn">Prev</button>
            <button id="nextBtn" class="control-btn">Next</button>
        </div>
    </section>

    <section class="api-container">
        <h2>Live Asynchronous API Integration</h2>
        <button id="fetchDataBtn">Load Dynamic Data Entry</button>
        <div id="apiDisplay" class="api-display-box">
            <p>Click the button above to extract async mock content placeholder metadata.</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
